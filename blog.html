<!DOCTYPE html>
<html lang="en" data-theme="dark" data-page="blog">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog &ndash; Ben</title>
  <meta name="description" content="Ben's blog: things I found interesting enough to write down.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script src="transitions.js"></script>
  <script src="script.js" defer></script>
  <script src="ascii.js" defer></script>
  <script src="components.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="link-btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"/></svg>
      Home
    </a>
  </header>

  <main class="blog">
    <h1 class="blog-title"><span class="grad-text"><span class="rotator" data-words="Blog, Notes, Ramblings, Rants, Brain dumps" data-label="Blog">Blog</span></span></h1>

    <div class="tabs" role="group" aria-label="Categories" hidden></div>

    <!-- Newest first. To add a post, copy a file in posts/ and add an <li> like
         this one inside the list. data-category sets its tab. Covers cycle
         through six gradients; put an <img> inside the .cover span to use a
         picture instead.

      <li data-category="Category">
        <a class="post-card" href="posts/your-post.html">
          <span class="cover" aria-hidden="true"></span>
          <span class="post-title">Post title</span>
          <span class="post-meta"><span>Category</span><time datetime="2026-10-11">Oct 11, 2026</time></span>
        </a>
      </li>
    -->
    <ul class="post-grid" id="posts">
    </ul>
    <p class="blog-empty">Nothing here yet.</p>
  </main>
</body>
</html>
