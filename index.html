<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ben Harvey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400&family=Inter:wght@300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background-color: #080810;
      color: #e2dff8;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 600px; height: 600px; top: -150px; left: -100px;
      background: radial-gradient(circle, rgba(99,60,180,0.35) 0%, transparent 70%);
      animation: drift1 18s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 500px; height: 500px; bottom: -100px; right: -80px;
      background: radial-gradient(circle, rgba(40,90,180,0.3) 0%, transparent 70%);
      animation: drift2 22s ease-in-out infinite alternate;
    }
    .blob-3 {
      width: 400px; height: 400px; top: 40%; left: 55%;
      background: radial-gradient(circle, rgba(160,60,140,0.2) 0%, transparent 70%);
      animation: drift3 15s ease-in-out infinite alternate;
    }

    @keyframes drift1 {
      from { transform: translate(0,0) scale(1); } to { transform: translate(60px,40px) scale(1.1); }
    }
    @keyframes drift2 {
      from { transform: translate(0,0) scale(1); } to { transform: translate(-50px,-30px) scale(1.08); }
    }
    @keyframes drift3 {
      from { transform: translate(0,0) scale(1); } to { transform: translate(-40px,50px) scale(0.92); }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 10;
    }

    .container {
      position: relative;
      z-index: 20;
      text-align: center;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 0.35rem 1rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(200,195,240,0.6);
      animation: fadeSlideUp 0.9s ease 0.1s both;
      backdrop-filter: blur(8px);
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #a78bfa;
      animation: pulse 2.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(167,139,250,0.4); }
      50%       { opacity: 0.5; box-shadow: 0 0 0 4px rgba(167,139,250,0); }
    }

    .name {
      font-size: clamp(3.5rem, 11vw, 8rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #ffffff 0%, #c4b8f5 40%, #8b7fd4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeSlideUp 0.9s ease 0.25s both;
    }

    .corner {
      position: fixed;
      width: 18px; height: 18px;
      border-color: rgba(255,255,255,0.08);
      border-style: solid;
      opacity: 0;
      animation: fadeSlideUp 1.2s ease 0.5s forwards;
    }
    .corner--tl { top: 1.75rem; left: 1.75rem; border-width: 1px 0 0 1px; }
    .corner--tr { top: 1.75rem; right: 1.75rem; border-width: 1px 1px 0 0; }
    .corner--bl { bottom: 1.75rem; left: 1.75rem; border-width: 0 0 1px 1px; }
    .corner--br { bottom: 1.75rem; right: 1.75rem; border-width: 0 1px 1px 0; }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <div class="container">
    <div class="badge">
      <span class="dot"></span>
      Under Construction
    </div>
    <h1 class="name">Ben Harvey</h1>
  </div>

</body>
</html>
