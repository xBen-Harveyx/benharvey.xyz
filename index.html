<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Ben Harvey's website is currently under construction."
  />
  <title>Ben Harvey | Under Construction</title>
  <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      color-scheme: dark;
      --bg: #080810;
      --panel: rgba(12, 18, 28, 0.82);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: rgba(226, 232, 240, 0.7);
      --accent: #f59e0b;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Space Grotesk", system-ui, sans-serif;
      color: var(--text);
      background-color: var(--bg);
      overflow: hidden;
      position: relative;
      display: grid;
      place-items: start center;
      min-height: 100vh;
      padding: 10rem 2rem 2rem;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.04;
    }

    body::after {
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.28));
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-a {
      width: 600px;
      height: 600px;
      top: -150px;
      left: -100px;
      background: radial-gradient(circle, rgba(99, 60, 180, 0.35) 0%, transparent 70%);
      animation: drift1 18s ease-in-out infinite alternate;
    }

    .glow-b {
      width: 500px;
      height: 500px;
      bottom: -100px;
      right: -80px;
      background: radial-gradient(circle, rgba(40, 90, 180, 0.3) 0%, transparent 70%);
      animation: drift2 22s ease-in-out infinite alternate;
    }

    .glow-c {
      width: 400px;
      height: 400px;
      top: 40%;
      left: 55%;
      background: radial-gradient(circle, rgba(160, 60, 140, 0.2) 0%, transparent 70%);
      animation: drift3 15s ease-in-out infinite alternate;
    }

    .frame {
      position: relative;
      z-index: 1;
      width: min(608px, 100%);
      border: 1px solid var(--panel-border);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      overflow: hidden;
      text-align: center;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255, 255, 255, 0.04);
      pointer-events: none;
      inset: 0.75rem;
    }

    .content {
      position: relative;
      padding: 3.2rem 1.6rem 2.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.52rem;
      padding: 0.36rem 0.72rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 0.61rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
    }

    .status-dot {
      width: 0.44rem;
      height: 0.44rem;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.45);
      animation: pulse 2.4s ease-in-out infinite;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 4.8rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      max-width: 8ch;
    }

    h1 .serif {
      display: block;
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      color: #fde68a;
    }

    .message {
      max-width: 27rem;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.7;
    }

    .rule {
      width: min(7.2rem, 40%);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.24), transparent);
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.4);
      }
      50% {
        transform: scale(0.92);
        box-shadow: 0 0 0 8px rgba(245, 158, 11, 0);
      }
    }

    @keyframes drift {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(1rem, -0.75rem, 0) scale(1.04);
      }
    }

    @keyframes drift1 {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(60px, 40px) scale(1.1); }
    }

    @keyframes drift2 {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(-50px, -30px) scale(1.08); }
    }

    @keyframes drift3 {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(-40px, 50px) scale(0.92); }
    }

    @media (max-width: 640px) {
      body {
        padding: 6rem 1rem 1rem;
      }

      .content {
        padding: 2.4rem 1rem;
      }

      .message {
        font-size: 0.84rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="glow glow-c"></div>

  <section class="frame" aria-label="Under construction page">
    <div class="content">
      <div class="badge">
        <span class="status-dot" aria-hidden="true"></span>
        Under Construction
      </div>
      <h1>
        <span class="serif">under construction</span>
      </h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="message">
        This website is currently being updated. Please check back soon.
      </p>
    </div>
  </section>
</body>
</html>
